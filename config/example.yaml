# Feature scaffold configuration
# Equivalent to the CONFIGURATION section in NewFeatureScaffold.tt

feature_name: ProductAttribute
# Irregular plural. Default: feature_name + "s"
feature_name_plural: ProductAttributes

# Solution root directory. Override with -s on CLI.
solution_dir: C:\Work\TPOSAPP

# Keep Domain.Shared for now. Example for ProductCategory: "Models\\Products"
domain_shared_model_folder: "Models\\Products"

# DTO properties: [Type, Name, IsRequired, DefaultValue]
upsert_properties:
  - ["string", "Name", "true", ""]
  - ["string", "Code", "false", "string.Empty"]

dto_properties:
  - ["long", "Id", "true", ""]
  - ["string", "Name", "true", ""]
  - ["string", "Code", "true", ""]

# Optional filters for GetAll. Leave empty for only TPosPagedRequest.
# Each filter: [Type, Name, BindingSource]
get_all_filters:
  - ["string?", "code", "FromQuery"]

dry_run: false
